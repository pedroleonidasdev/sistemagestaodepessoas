
services:
  mysql:
    image: mysql:8.4
    container_name: gestao-dp-mysql-novo
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestao_dp
      MYSQL_USER: gestao
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - gestao_dp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  gestao_dp_mysql_data:
